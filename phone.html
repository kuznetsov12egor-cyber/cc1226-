<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Castles — Phone</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:16px Arial;display:grid;place-items:center}main{width:min(90vw,420px);text-align:center}button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:10px;font-size:18px}</style></head><body><main><h2>CRYSTAL CASTLES</h2><p id="s">Телефон будет использоваться как камера.</p><button id="go">Разрешить датчики и подключиться</button></main><script>const p=new URLSearchParams(location.search),server=p.get('server')||'',room=p.get('room')||'main';let ws;function q(a,b,c){a*=Math.PI/360;b*=Math.PI/360;c*=Math.PI/360;let A=Math.cos(a),B=Math.sin(a),C=Math.cos(b),D=Math.sin(b),E=Math.cos(c),F=Math.sin(c);return{x:A*D*E+B*C*F,y:A*D*F-B*C*E,z:B*D*E-A*C*F,w:A*C*E-B*D*F}}async function start(){if(!server){s.textContent='Нет адреса сервера.';return}if(DeviceOrientationEvent.requestPermission){if(await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Доступ к датчикам запрещён')}ws=new WebSocket(server);ws.onopen=()=>{ws.send(JSON.stringify({type:'phone',room}));s.textContent='Подключено. Держи телефон как голову.'};addEventListener('deviceorientation',e=>{if(ws?.readyState===1){let v=q(e.alpha||0,e.beta||0,e.gamma||0);ws.send(JSON.stringify({type:'orientation',room,...v}))}},true)}go.onclick=()=>start().catch(e=>s.textContent=e.message)</script></body></html>
